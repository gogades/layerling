<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>layerling social card</title>
    <!--
      Die Vorlage fuer apps/web/public/assets/layerling/layerling-social.png -
      das Bild, das erscheint, wenn jemand layerling.com irgendwo einfuegt.

      Warum eine HTML-Seite und nicht das Werkzeug, das die uebrigen Symbole
      zeichnet: Auf dieser Karte steht Schrift, und Schrift zu rastern heisst
      eine Schriftdatei zu lesen. Ein Browser kann das laengst. Erzeugt wird
      das Bild mit `npm run icons:social`, und zwar einmal - danach liegt das
      PNG im Baum und niemand braucht dafuer einen Browser.
    -->
    <style>
      :root {
        --ground: #b7630b;
        --ink: #fff4e2;
        --ink-soft: #f6d6a8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 640px;
      }
      body {
        background: var(--ground);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 76px;
        padding: 0 80px;
        font-family: "Segoe UI Variable Display", "Segoe UI", -apple-system, system-ui, sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      svg {
        height: 236px;
        width: auto;
        flex: none;
      }
      h1 {
        font-size: 124px;
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1;
      }
      p {
        margin-top: 26px;
        font-size: 46px;
        font-weight: 400;
        color: var(--ink-soft);
        letter-spacing: -0.005em;
      }
    </style>
  </head>
  <body>
    <!-- Hier setzt render-social-card.mjs das Zeichen aus
         assets/layerling/layerling-icon.svg ein, ohne dessen Grundflaeche -
         der Grund ist auf dieser Karte die Karte selbst. Abgeschrieben wird es
         nicht: Sonst haette die Marke zwei Quellen, und eine davon veraltet. -->
    <!--MARKE-->
    <div>
      <h1>layerling</h1>
      <p>Easy 3D CAD for 3D printing</p>
    </div>
  </body>
</html>
