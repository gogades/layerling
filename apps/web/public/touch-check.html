<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>layerling - Fingerprobe</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px;
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: #3d2d1c;
    background: #fbf7f1;
  }
  h1 { margin: 0 0 4px; font-size: 19px; }
  p.lead { margin: 0 0 12px; color: #7a6650; }
  .facts, .counts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 6px;
    margin-bottom: 10px;
  }
  .box {
    padding: 7px 9px;
    background: #fff;
    border: 1px solid #ecdfcc;
    border-radius: 8px;
  }
  .box b { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #8a7562; }
  .box span { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .good { color: #1f7a3d; }
  .bad { color: #b2312b; }
  #pad {
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    height: 34vh;
    min-height: 170px;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 12px;
    color: #8a5a1c;
    background: repeating-linear-gradient(45deg, #fdf0dc, #fdf0dc 12px, #fbe8cc 12px, #fbe8cc 24px);
    border: 2px dashed #d9b787;
    border-radius: 14px;
  }
  #pad.hot { border-color: #1f7a3d; background: #eaf6ee; color: #1f7a3d; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
  button {
    font: inherit;
    font-weight: 700;
    padding: 8px 14px;
    color: #5c442c;
    background: #fff;
    border: 1px solid #e0d2bd;
    border-radius: 8px;
  }
  label { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; }
  #log {
    height: 30vh;
    min-height: 150px;
    overflow: auto;
    margin: 0;
    padding: 8px;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap;
    background: #fff;
    border: 1px solid #ecdfcc;
    border-radius: 8px;
  }
</style>
</head>
<body>
<h1>Fingerprobe</h1>
<p class="lead">Mit <b>zwei Fingern</b> in das gestreifte Feld fassen und spreizen. Diese Seite gehört nicht zum Editor -
sie meldet nur, was der Browser an Zeigerereignissen liefert.</p>

<div class="facts" id="facts"></div>

<div class="counts">
  <div class="box"><b>Finger gerade</b><span id="now">0</span></div>
  <div class="box"><b>Meiste zugleich</b><span id="max">0</span></div>
  <div class="box"><b>pointerdown</b><span id="downs">0</span></div>
  <div class="box"><b>pointermove</b><span id="moves">0</span></div>
  <div class="box"><b>pointercancel</b><span id="cancels">0</span></div>
  <div class="box"><b>Safari-Geste</b><span id="gestures">0</span></div>
</div>

<div id="pad">Hier mit zwei Fingern spreizen</div>

<div class="row">
  <button type="button" id="reset">Zurücksetzen</button>
  <label><input type="checkbox" id="block" checked> Safari-Geste blockieren</label>
</div>

<pre id="log"></pre>

<script>
(function () {
  var pad = document.getElementById('pad');
  var logEl = document.getElementById('log');
  var active = Object.create(null);
  var counts = { downs: 0, moves: 0, cancels: 0, gestures: 0, max: 0 };
  var lines = [];
  var lastMoveLog = 0;

  function activeCount() {
    return Object.keys(active).length;
  }

  function show() {
    document.getElementById('now').textContent = activeCount();
    document.getElementById('max').textContent = counts.max;
    document.getElementById('downs').textContent = counts.downs;
    document.getElementById('moves').textContent = counts.moves;
    var cancels = document.getElementById('cancels');
    cancels.textContent = counts.cancels;
    cancels.className = counts.cancels > 0 ? 'bad' : '';
    var gestures = document.getElementById('gestures');
    gestures.textContent = counts.gestures;
    gestures.className = counts.gestures > 0 ? 'bad' : '';
    document.getElementById('max').className = counts.max >= 2 ? 'good' : '';
    pad.className = activeCount() > 0 ? 'hot' : '';
  }

  function log(text) {
    lines.push(text);
    if (lines.length > 40) lines.shift();
    logEl.textContent = lines.join('\n');
    logEl.scrollTop = logEl.scrollHeight;
  }

  function stamp(event) {
    return '#' + event.pointerId + ' ' + event.pointerType
      + ' @' + Math.round(event.clientX) + ',' + Math.round(event.clientY)
      + ' (' + activeCount() + ' Finger)';
  }

  pad.addEventListener('pointerdown', function (event) {
    active[event.pointerId] = true;
    counts.downs += 1;
    if (activeCount() > counts.max) counts.max = activeCount();
    log('down   ' + stamp(event) + (event.isPrimary ? ' primär' : ''));
    show();
  });

  pad.addEventListener('pointermove', function (event) {
    if (!active[event.pointerId]) return;
    counts.moves += 1;
    var now = Date.now();
    if (now - lastMoveLog > 250) {
      lastMoveLog = now;
      log('move   ' + stamp(event));
    }
    show();
  });

  function end(kind) {
    return function (event) {
      delete active[event.pointerId];
      if (kind === 'cancel') counts.cancels += 1;
      log((kind === 'cancel' ? 'CANCEL ' : 'up     ') + stamp(event));
      show();
    };
  }

  pad.addEventListener('pointerup', end('up'));
  pad.addEventListener('pointercancel', end('cancel'));

  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (name) {
    pad.addEventListener(name, function (event) {
      if (name === 'gesturestart') counts.gestures += 1;
      if (document.getElementById('block').checked && event.cancelable) event.preventDefault();
      if (name !== 'gesturechange') log('SAFARI ' + name + (event.cancelable ? ' (geblockt)' : ' (nicht abwendbar)'));
      show();
    });
  });

  document.getElementById('reset').addEventListener('click', function () {
    active = Object.create(null);
    counts = { downs: 0, moves: 0, cancels: 0, gestures: 0, max: 0 };
    lines = [];
    logEl.textContent = '';
    show();
  });

  /**
   * Ein selbst gebautes Zeigerereignis traegt clientX - ob daraus auch pageX
   * wird, entscheidet der Browser. Chrome rechnet es aus, WebKit nicht. Genau
   * daran haengt die Zwei-Finger-Geste, weil three.js im Beruehrungszweig nur
   * mit pageX rechnet.
   */
  function probePageX() {
    try {
      var test = new PointerEvent('pointerdown', { clientX: 123, clientY: 45, pointerId: 99, pointerType: 'touch' });
      var ok = test.pageX === 123 + window.scrollX;
      return '<span class="' + (ok ? 'good' : 'bad') + '">' + test.pageX + ' / ' + test.pageY + (ok ? ' (abgeleitet)' : ' (NICHT abgeleitet)') + '</span>';
    } catch (error) {
      return '<span class="bad">Fehler</span>';
    }
  }

  var facts = [
    ['Gerät', /iPad|Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1 ? 'iPad / iOS' : (navigator.userAgent.match(/(Android|iPhone|Windows|Macintosh|Linux)/) || ['unbekannt'])[0]],
    ['maxTouchPoints', String(navigator.maxTouchPoints)],
    ['pointer: coarse', window.matchMedia('(pointer: coarse)').matches ? 'ja' : 'nein'],
    ['PointerEvent', 'PointerEvent' in window ? 'ja' : 'NEIN'],
    ['touch-action', getComputedStyle(pad).touchAction],
    ['Kunstereignis pageX', probePageX()],
    ['Fenster', '<span id="size">' + window.innerWidth + ' x ' + window.innerHeight + '</span>'],
  ];
  document.getElementById('facts').innerHTML = facts.map(function (entry) {
    var value = entry[1].charAt(0) === '<' ? entry[1] : '<span>' + entry[1] + '</span>';
    return '<div class="box"><b>' + entry[0] + '</b>' + value + '</div>';
  }).join('');

  function showSize() {
    var size = document.getElementById('size');
    if (size) size.textContent = window.innerWidth + ' x ' + window.innerHeight;
  }
  window.addEventListener('resize', showSize);
  window.addEventListener('orientationchange', function () { setTimeout(showSize, 200); });
  showSize();

  show();
  log('bereit - ' + navigator.userAgent);
})();
</script>
</body>
</html>
